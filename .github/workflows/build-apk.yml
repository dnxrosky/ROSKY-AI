name: Build ROSKY AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unpack Android project
        run: |
          unzip -o ROSKY_AI_Android_Project-1.zip
          test -f ROSKY_AI_Android_Project/settings.gradle.kts

      - name: Build APK
        working-directory: ROSKY_AI_Android_Project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ROSKY-AI-debug-APK
          path: ROSKY_AI_Android_Project/app/build/outputs/apk/debug/app-debug.apk
